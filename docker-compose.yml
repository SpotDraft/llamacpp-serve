name: llamacpp-serve

x-llama-base: &llama-base
  image: ghcr.io/ggml-org/llama.cpp:server-cuda
  restart: unless-stopped
  # Run as the host user so files created are not root-owned.
  user: "1000:1000"
  # Harden: no new privileges, drop all capabilities.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # GPU access via the NVIDIA CDI device (DGX Spark / GB10).
  deploy:
    resources:
      reservations:
        devices:
          - driver: cdi
            device_ids:
              - nvidia.com/gpu=all
            capabilities:
              - gpu
  # llama-server config via its LLAMA_ARG_* env vars.
  # Router mode (no LLAMA_ARG_MODEL): every .gguf dropped into var/lib/llama/
  # (mounted /models) is discovered at startup. A model loads into its own
  # child llama-server process on first request and is LRU-evicted when
  # --models-max is reached. All settings below are inherited by the children.
  environment:
    LLAMA_ARG_HOST: 0.0.0.0
    LLAMA_ARG_PORT: "8080"
    LLAMA_ARG_MODELS_DIR: /models
    LLAMA_ARG_MODELS_MAX: "4"
    LLAMA_ARG_CONTEXT_SIZE: "16384"
    LLAMA_ARG_N_GPU_LAYERS: "999"
    LLAMA_ARG_PARALLEL: "2"
    LLAMA_ARG_FLASH_ATTN: "on"
    # CUDA compute cache and any other writes go to this writable HOME.
    HOME: /root
  # Models are read-only; a separate writable dir covers /root so the
  # non-root user can traverse it (image /root is mode 700 root).
  volumes:
    - ./var/lib/llama:/models:ro
    - ./var/lib/llama-home:/root
  networks:
    - llama
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "100"

x-socat-base: &socat-base
  image: alpine/socat:latest
  restart: unless-stopped
  user: "1000:1000"
  # Harden: no new privileges, drop all capabilities.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - ./var/run/sockets:/sockets
  networks:
    - llama
  depends_on:
    - llama-1
  logging:
    driver: "json-file"
    options:
      max-size: "5m"
      max-file: "100"

services:
  llama-1:
    <<: *llama-base

  socat-1:
    <<: *socat-base
    command: UNIX-LISTEN:/sockets/llama-1.sock,unlink-early,fork,reuseaddr,mode=660 TCP:llama-1:8080
    depends_on:
      - llama-1

  llama-2:
    <<: *llama-base

  socat-2:
    <<: *socat-base
    command: UNIX-LISTEN:/sockets/llama-2.sock,unlink-early,fork,reuseaddr,mode=660 TCP:llama-2:8080
    depends_on:
      - llama-2

  # The governed front door: observability, rate limits and concurrency caps.
  # Everything on nginx :11437 goes through here; it routes to llama-1/llama-2
  # directly over the compose network as two load-balanced deployments.
  litellm:
    image: ghcr.io/berriai/litellm:v1.97.0
    restart: unless-stopped
    # Harden: no new privileges, drop all capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # NOTE: unlike the rest of the stack this runs as the image's default user
    # instead of 1000:1000. The non-root variant (litellm-non_root) runs as
    # `nobody` and has open issues with the startup Prisma migration. It is
    # safe here because LiteLLM writes to no host bind mount -- all state lives
    # in the remote Postgres and both mounts below are read-only -- so nothing
    # ends up root-owned on the host.
    command: ["--config", "/app/config/config.yaml", "--port", "4000"]
    # DATABASE_URL, LITELLM_MASTER_KEY, LITELLM_SALT_KEY, UI_USERNAME,
    # UI_PASSWORD and the OTEL_* vars. Created by ./setup.sh.
    #
    # required: false so that `docker compose config` still parses on a fresh
    # clone. A missing .env is instead reported by the ${LITELLM_WEBUI_KEY:?}
    # guard on the webui service, which names the file to create.
    env_file:
      - path: .env
        required: false
    environment:
      # Do not auto-load a .env from the image's workdir.
      LITELLM_MODE: PRODUCTION
      # The model_list is generated from disk; the DB must not be a second
      # source of truth for it (see litellm/config.yaml).
      STORE_MODEL_IN_DB: "False"
    volumes:
      - ./litellm/config.yaml:/app/config/config.yaml:ro
      # Generated by litellm/gen-models.sh. `include:` in config.yaml resolves
      # relative to config.yaml, so both must land in the same directory.
      #
      # create_host_path: false so that skipping ./setup.sh fails loudly. With
      # Docker's default, a missing file here is silently created as a
      # *directory*, and LiteLLM then dies on an unreadable include.
      - type: bind
        source: ./var/run/litellm/models.generated.yaml
        target: /app/config/models.generated.yaml
        read_only: true
        bind:
          create_host_path: false
    networks:
      - llama
    depends_on:
      - llama-1
      - llama-2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "100"

  socat-litellm:
    <<: *socat-base
    command: UNIX-LISTEN:/sockets/litellm.sock,unlink-early,fork,reuseaddr,mode=660 TCP:litellm:4000
    depends_on:
      - litellm

  webui:
    build:
      context: .
      dockerfile: webui/Dockerfile
    image: llamacpp-serve-webui
    restart: unless-stopped
    # Run as the host user so the SQLite DB and uploads are not root-owned.
    user: "1000:1000"
    # Harden: no new privileges, drop all capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Point at the LiteLLM gateway over TLS. 172.31.0.1 is the pinned bridge
    # gateway -> the host, where nginx (host network) listens on 11437 and
    # proxies to LiteLLM.
    environment:
      OPENAI_API_BASE_URL: https://172.31.0.1:11437/v1
      # Public URL of this webui as seen by browsers (via nginx :11438).
      WEBUI_URL: https://localhost:11438
      # LiteLLM enforces auth, so this must be a real key. Use a per-client
      # virtual key (created in the Admin UI) rather than the master key, so
      # the UI's traffic is attributable and independently rate-limitable.
      OPENAI_API_KEY: ${LITELLM_WEBUI_KEY:?set LITELLM_WEBUI_KEY in .env (see .env.example)}
      # Disable the bundled Ollama backend - llama.cpp is the only engine.
      ENABLE_OLLAMA_API: "false"
      # start.sh writes the secret key to the workdir (/app/backend, root-owned
      # in the image); redirect it into our writable data mount.
      WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key
      # Use the system bundle (our CA baked in at build time) so httpx/
      # requests verify the pool cert without breaking other TLS.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    # SQLite DB + uploads live in this host dir.
    volumes:
      - ./var/lib/webui:/app/backend/data
    # No TCP ports published: the only path in is the unix socket bridged by
    # socat-webui, which nginx :11438 (HTTPS) proxies to.
    networks:
      - llama
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "100"

  socat-webui:
    image: alpine/socat:latest
    restart: unless-stopped
    user: "1000:1000"
    # Harden: no new privileges, drop all capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./var/run/sockets:/sockets
    networks:
      - llama
    depends_on:
      - webui
    command: UNIX-LISTEN:/sockets/webui.sock,unlink-early,fork,reuseaddr,mode=660 TCP:webui:8080
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "100"

  nginx:
    image: nginx:latest
    restart: unless-stopped
    # Run as non-root.
    user: "1000:1000"
    # Write the initial upstream config, then keep nginx as PID 1 while the
    # health-check watcher regenerates the upstream and reloads on changes.
    command: >-
      sh -c "/healthcheck.sh --init &&
             (/healthcheck.sh --watch &) &&
             exec /docker-entrypoint.sh nginx -g 'daemon off;'"
    # Host networking so nginx listens on the host's :11437/:11438 and the
    # webui can reach the pool via the pinned bridge gateway (172.31.0.1).
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/healthcheck.sh:/healthcheck.sh:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./var/run/sockets:/sockets:ro
      - ./var/run/nginx:/etc/nginx/runtime
    depends_on:
      - socat-1
      - socat-2
      - socat-litellm
      - socat-webui
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "100"

networks:
  llama:
    # Pin a subnet so the bridge gateway (172.31.0.1) is deterministic.
    # The webui uses this IP to reach nginx (host network) over TLS, and
    # the server cert has it in its SANs.
    ipam:
      config:
        - subnet: 172.31.0.0/24
