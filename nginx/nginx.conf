pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  # Non-root nginx can't write the default /var/cache/nginx temp dirs.
  client_body_temp_path /tmp/nginx_client_body;
  proxy_temp_path /tmp/nginx_proxy;
  fastcgi_temp_path /tmp/nginx_fastcgi;
  uwsgi_temp_path /tmp/nginx_uwsgi;
  scgi_temp_path /tmp/nginx_scgi;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Active health checks: upstream regenerated by healthcheck.sh from the
  # current socket state; only healthy instances are listed.
  include /etc/nginx/runtime/upstream.conf;

  # HTTPS-only entry point for the llama.cpp pool.
  server {
    listen 11437 ssl;
    listen [::]:11437 ssl;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    client_max_body_size 128m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";

    # Do not buffer streaming (SSE) responses from llama-server.
    proxy_buffering off;
    proxy_cache off;

    # Model generation can take a while.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Engine metrics stay off the front door. llama-server's /metrics is on
    # (LLAMA_ENDPOINT_METRICS), but this listener is not bound to loopback, so
    # proxying it would publish token counts and throughput to anything that
    # can reach the host. The collector scrapes the routers directly over the
    # `llama` network instead, and round-robin would make a scrape through here
    # land on a random router anyway. Remove this block to expose it.
    location = /metrics {
      deny all;
    }

    location / {
      proxy_pass http://llama_pool;
    }
  }

  # HTTPS-only entry point for the Open WebUI, proxying to its loopback-only
  # published port so the UI is never exposed as plain HTTP.
  server {
    listen 11438 ssl;
    listen [::]:11438 ssl;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    client_max_body_size 128m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Do not buffer streaming (SSE) responses from the webui.
    proxy_buffering off;
    proxy_cache off;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
      proxy_pass http://unix:/sockets/webui.sock:;
    }
  }
}
