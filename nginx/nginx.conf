pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  # Non-root nginx can't write the default /var/cache/nginx temp dirs.
  client_body_temp_path /tmp/nginx_client_body;
  proxy_temp_path /tmp/nginx_proxy;
  fastcgi_temp_path /tmp/nginx_fastcgi;
  uwsgi_temp_path /tmp/nginx_uwsgi;
  scgi_temp_path /tmp/nginx_scgi;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Active health checks: upstream regenerated by healthcheck.sh from the
  # current socket state; only healthy instances are listed.
  include /etc/nginx/runtime/upstream.conf;

  # --- Request correlation ---------------------------------------------------
  # Reuse a client-supplied X-Request-ID when present, otherwise mint nginx's
  # per-request $request_id. The same value is sent upstream, echoed back to
  # the client, and written to the access log, so a client-visible id ties
  # together the nginx log line, the LiteLLM/llama-server log entry and (when
  # the otel callback is on) the exported span.
  # Only honour a client id that actually looks like one: 8-64 chars of
  # [A-Za-z0-9._:-]. Anything else -- empty, over-long, or carrying quotes,
  # spaces or control characters that would smear one access-log line into
  # the next -- falls back to nginx's own $request_id. So a caller can join
  # an existing trace but cannot choose what our logs look like, flood them
  # with an unbounded value, or collide with somebody else's id.
  map $http_x_request_id $req_id {
    default                    $request_id;
    "~^[A-Za-z0-9._:-]{8,64}$" $http_x_request_id;
  }

  log_format main_reqid '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rid=$req_id rt=$request_time urt=$upstream_response_time';
  access_log /dev/stdout main_reqid;

  # HTTPS-only entry point for the llama.cpp pool.
  server {
    listen 11437 ssl;
    listen [::]:11437 ssl;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    client_max_body_size 128m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";

    proxy_set_header X-Request-ID $req_id;
    add_header X-Request-ID $req_id always;

    # Do not buffer streaming (SSE) responses from llama-server.
    proxy_buffering off;
    proxy_cache off;

    # Model generation can take a while.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
      proxy_pass http://llama_pool;
    }
  }

  # HTTPS-only entry point for the Open WebUI, proxying to its loopback-only
  # published port so the UI is never exposed as plain HTTP.
  server {
    listen 11438 ssl;
    listen [::]:11438 ssl;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    client_max_body_size 128m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header X-Request-ID $req_id;
    add_header X-Request-ID $req_id always;

    # Do not buffer streaming (SSE) responses from the webui.
    proxy_buffering off;
    proxy_cache off;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
      proxy_pass http://unix:/sockets/webui.sock:;
    }
  }
}
