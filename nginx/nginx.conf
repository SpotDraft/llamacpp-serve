pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  # Non-root nginx can't write the default /var/cache/nginx temp dirs.
  client_body_temp_path /tmp/nginx_client_body;
  proxy_temp_path /tmp/nginx_proxy;
  fastcgi_temp_path /tmp/nginx_fastcgi;
  uwsgi_temp_path /tmp/nginx_uwsgi;
  scgi_temp_path /tmp/nginx_scgi;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Active health checks: upstream regenerated by healthcheck.sh from the
  # current socket state; only healthy instances are listed. Since LiteLLM
  # took over load balancing for :11437, this pool now backs only the
  # :11439 bypass listener below.
  include /etc/nginx/runtime/upstream.conf;

  # HTTPS-only entry point for the LiteLLM gateway: the OpenAI-compatible API
  # (/v1/...) plus the Admin UI (/ui). LiteLLM authenticates every request,
  # applies per-key rate limits and concurrency caps, records spend logs and
  # emits OTEL spans, then routes to llama-1/llama-2 over the compose network.
  server {
    listen 11437 ssl;
    listen [::]:11437 ssl;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    client_max_body_size 128m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Do not buffer streaming (SSE) responses from LiteLLM.
    proxy_buffering off;
    proxy_cache off;

    # Model generation can take a while, and a cold model must load its
    # weights into VRAM before the first token. Matches request_timeout in
    # litellm/config.yaml.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
      proxy_pass http://unix:/sockets/litellm.sock:;
    }
  }

  # Direct, ungoverned access to the llama.cpp router pool -- no auth, no rate
  # limits, no logging. This bypasses every guard rail LiteLLM provides, so it
  # exists only for debugging the routers themselves (is a model loading? is a
  # router healthy?) when you need to rule LiteLLM out. Do not point clients at
  # it; they would hammer the GPU unmetered.
  server {
    listen 11439 ssl;
    listen [::]:11439 ssl;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    client_max_body_size 128m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_cache off;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
      proxy_pass http://llama_pool;
    }
  }

  # HTTPS-only entry point for the Open WebUI, proxying to its loopback-only
  # published port so the UI is never exposed as plain HTTP.
  server {
    listen 11438 ssl;
    listen [::]:11438 ssl;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    client_max_body_size 128m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Do not buffer streaming (SSE) responses from the webui.
    proxy_buffering off;
    proxy_cache off;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
      proxy_pass http://unix:/sockets/webui.sock:;
    }
  }
}
