pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  # Non-root nginx can't write the default /var/cache/nginx temp dirs.
  client_body_temp_path /tmp/nginx_client_body;
  proxy_temp_path /tmp/nginx_proxy;
  fastcgi_temp_path /tmp/nginx_fastcgi;
  uwsgi_temp_path /tmp/nginx_uwsgi;
  scgi_temp_path /tmp/nginx_scgi;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # HTTPS-only LiteLLM: OpenAI-compatible API (/v1/...) plus Admin UI (/ui).
  # llama.cpp is not published; LiteLLM reaches llama-1/llama-2 on the compose
  # network so each GGUF stays pinned to one router.
  server {
    listen 11437 ssl;
    listen [::]:11437 ssl;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    client_max_body_size 128m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Do not buffer streaming (SSE) responses from LiteLLM.
    proxy_buffering off;
    proxy_cache off;

    # Model generation can take a while, and a cold model must load its
    # weights into VRAM before the first token. Matches request_timeout in
    # litellm/config.yaml.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
      proxy_pass http://unix:/sockets/litellm.sock:;
      # LiteLLM's Admin UI issues absolute http:// redirects; rewrite them
      # so the browser stays on this TLS vhost.
      proxy_redirect http:// https://;
    }
  }

  # HTTPS-only Open WebUI.
  server {
    listen 11438 ssl;
    listen [::]:11438 ssl;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    client_max_body_size 128m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Do not buffer streaming (SSE) responses from the webui.
    proxy_buffering off;
    proxy_cache off;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
      proxy_pass http://unix:/sockets/webui.sock:;
    }
  }
}
