# LiteLLM in front of llama.cpp: auth, rate limits, concurrency caps, spend logs.
#
#   docker compose -f docker-compose.yml -f docker-compose.litellm.yml up -d
#   # or append :docker-compose.litellm.yml to COMPOSE_FILE in .env
#
# Run ./litellm/gen-models.sh before the first start so the model_list exists.
# Postgres is bundled (no host port).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - llama
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "20"

  litellm:
    image: ghcr.io/berriai/litellm:v1.97.0
    restart: unless-stopped
    # Harden: no new privileges, drop all capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # NOTE: unlike the rest of the stack this runs as the image's default user
    # instead of 1000:1000. The non-root variant (litellm-non_root) runs as
    # `nobody` and has open issues with the startup Prisma migration. It is
    # safe here because LiteLLM writes to no host bind mount -- all state lives
    # in Postgres and both mounts below are read-only -- so nothing ends up
    # root-owned on the host.
    command: ["--config", "/app/config/config.yaml", "--port", "4000"]
    # LITELLM_MASTER_KEY, LITELLM_SALT_KEY, UI_USERNAME, UI_PASSWORD and the
    # OTEL_* vars. Created by ./setup.sh. DATABASE_URL is set below so a
    # placeholder in .env cannot point LiteLLM at a missing remote host.
    env_file:
      - path: .env
        required: false
    environment:
      # Do not auto-load a .env from the image's workdir.
      LITELLM_MODE: PRODUCTION
      # The model_list is generated from disk; the DB must not be a second
      # source of truth for it (see litellm/config.yaml).
      STORE_MODEL_IN_DB: "False"
      DATABASE_URL: postgresql://litellm:litellm@postgres:5432/litellm
    volumes:
      - ./litellm/config.yaml:/app/config/config.yaml:ro
      # Generated by litellm/gen-models.sh. `include:` in config.yaml resolves
      # relative to config.yaml, so both must land in the same directory.
      #
      # create_host_path: false so that skipping ./setup.sh fails loudly. With
      # Docker's default, a missing file here is silently created as a
      # *directory*, and LiteLLM then dies on an unreadable include.
      - type: bind
        source: ./var/run/litellm/models.generated.yaml
        target: /app/config/models.generated.yaml
        read_only: true
        bind:
          create_host_path: false
    networks:
      - llama
    depends_on:
      llama-1:
        condition: service_started
      llama-2:
        condition: service_started
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "100"

  socat-litellm:
    image: alpine/socat:latest
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./var/run/sockets:/sockets
    networks:
      - llama
    depends_on:
      - litellm
    command: UNIX-LISTEN:/sockets/litellm.sock,unlink-early,fork,reuseaddr,mode=660 TCP:litellm:4000
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "100"

  webui:
    environment:
      # LiteLLM enforces auth, so this must be a real key. Use a per-client
      # virtual key (created in the Admin UI) rather than the master key, so
      # the UI's traffic is attributable and independently rate-limitable.
      OPENAI_API_KEY: ${LITELLM_WEBUI_KEY:?set LITELLM_WEBUI_KEY in .env (see .env.example)}

  nginx:
    # No healthcheck.sh: llama.cpp is not on a host port when LiteLLM is on.
    command:
      - /docker-entrypoint.sh
      - nginx
      - -g
      - daemon off;
    volumes: !override
      - ./nginx/nginx.litellm.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./var/run/sockets:/sockets:ro
    depends_on:
      - socat-litellm
      - socat-webui

volumes:
  postgres-data: {}
