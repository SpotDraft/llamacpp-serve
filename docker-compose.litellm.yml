# LiteLLM in front of llama.cpp: auth, rate limits, concurrency caps, spend logs.
#
#   docker compose -f docker-compose.yml -f docker-compose.litellm.yml up -d
#   # or append :docker-compose.litellm.yml to COMPOSE_FILE in .env
#
# Run scripts/setup-litellm-stack.sh before the first start.
# Postgres and Redis are bundled (no host ports).

services:
  postgres:
    # Pinned by multi-arch index digest; bump deliberately with:
    #   docker buildx imagetools inspect postgres:16-alpine
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: litellm
      # From .env (generated by the LiteLLM setup). The `:-litellm` fallback
      # keeps stacks created before this variable existed working: Postgres
      # only applies POSTGRES_PASSWORD when initdb runs on an *empty* volume,
      # so handing an existing postgres-data volume a new password would lock
      # LiteLLM out of its own database. See the README for how to rotate.
      #
      # Keep the value URL-safe -- it is interpolated into DATABASE_URL below.
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-litellm}
      POSTGRES_DB: litellm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # `db` only -- nothing but LiteLLM has any business reaching Postgres, and
    # the network is internal so the database has no route off the host.
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "20"

  redis:
    # Response cache for LiteLLM. Pinned by multi-arch index digest; bump
    # deliberately with:
    #   docker buildx imagetools inspect redis:7-alpine
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      REDIS_PASSWORD: ${LITELLM_REDIS_PASSWORD:?set LITELLM_REDIS_PASSWORD in .env (run scripts/setup-litellm-stack.sh)}
      REDIS_MAXMEMORY: ${LITELLM_REDIS_MAXMEMORY:-1gb}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${LITELLM_REDIS_PASSWORD:?set LITELLM_REDIS_PASSWORD in .env (run scripts/setup-litellm-stack.sh)}
      - --maxmemory
      - ${LITELLM_REDIS_MAXMEMORY:-1gb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    # Dedicated internal segment: only LiteLLM can reach the cache.
    networks:
      - cache
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "20"

  litellm:
    # Version tag kept for readability, pinned by multi-arch index digest so a
    # retagged or compromised registry response cannot change the gateway on
    # restart. Bump deliberately with:
    #   docker buildx imagetools inspect ghcr.io/berriai/litellm:v1.97.0
    image: ghcr.io/berriai/litellm:v1.97.0@sha256:468c25f35f3e5ec4e414974f00deab93337b1b4d9953cabcfd3722e59415f834
    restart: unless-stopped
    # Harden: no new privileges, drop all capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # NOTE: unlike the rest of the stack this runs as the image's default user
    # instead of 1000:1000. The non-root variant (litellm-non_root) runs as
    # `nobody` and has open issues with the startup Prisma migration. It is
    # safe here because LiteLLM writes to no host bind mount -- all state lives
    # in Postgres and both mounts below are read-only -- so nothing ends up
    # root-owned on the host.
    command: ["--config", "/app/config/config.yaml", "--port", "4000"]
    # LITELLM_MASTER_KEY, LITELLM_SALT_KEY, UI_USERNAME, UI_PASSWORD and the
    # OTEL_* vars. Created by scripts/setup-litellm-stack.sh. DATABASE_URL is
    # placeholder in .env cannot point LiteLLM at a missing remote host.
    env_file:
      - path: .env
        required: false
    environment:
      # Do not auto-load a .env from the image's workdir.
      LITELLM_MODE: PRODUCTION
      # Admin UI (Models page, add/edit) requires this. The GGUF pin map is
      # still generated from disk; do not add a second api_base for a model
      # the generated config already pinned. Override with STORE_MODEL_IN_DB=False.
      STORE_MODEL_IN_DB: ${STORE_MODEL_IN_DB:-True}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:-litellm}@postgres:5432/litellm
      LITELLM_REDIS_PASSWORD: ${LITELLM_REDIS_PASSWORD:?set LITELLM_REDIS_PASSWORD in .env (run scripts/setup-litellm-stack.sh)}
    volumes:
      - ./litellm/config.yaml:/app/config/config.yaml:ro
      # Generated by scripts/generate-litellm-model-config.sh. `include:` resolves
      # relative to config.yaml, so both must land in the same directory.
      #
      # create_host_path: false so skipping LiteLLM setup fails loudly. With
      # Docker's default, a missing file here is silently created as a
      # *directory*, and LiteLLM then dies on an unreadable include.
      - type: bind
        source: ./var/run/litellm/models.generated.yaml
        target: /app/config/models.generated.yaml
        read_only: true
        bind:
          create_host_path: false
    # The only service bridging all four service segments: reached from
    # `llama` by socat-litellm, reaches the routers on `backend`, Postgres on
    # `db`, and Redis on `cache`.
    networks:
      - llama
      - backend
      - db
      - cache
    depends_on:
      llama-1:
        condition: service_started
      llama-2:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "100"

  socat-litellm:
    image: alpine/socat:latest@sha256:3ed1cd38741bd445ebffa3aecb9d80c46a83db45f5b5ef03332976c7ca9814af
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./var/run/sockets:/sockets
    networks:
      - llama
    depends_on:
      - litellm
    command: UNIX-LISTEN:/sockets/litellm.sock,unlink-early,fork,reuseaddr,mode=660 TCP:litellm:4000
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "100"

  # --- Network segmentation -------------------------------------------------
  #
  # The default stack puts everything on one `llama` network, which is fine
  # there because :11437 *is* the router pool -- there is nothing to bypass.
  # Once LiteLLM owns auth, rate limits and accounting, a flat network means
  # any peer can skip it: llama-server has no authentication of its own and
  # listens on 0.0.0.0:8080, so `webui` (which executes model-driven tool
  # calls and fetches user-supplied URLs) could call
  # http://llama-1:8080/v1/chat/completions directly and bypass every control
  # this overlay exists to add.
  #
  # So the routers move to an internal `backend` segment reachable only by
  # LiteLLM, Postgres and Redis get separate internal segments, and the webui
  # is confined to `frontend`. LiteLLM is the only service that spans segments.
  #
  #   frontend : webui, socat-webui                     (needs egress)
  #   llama    : nginx, socat-litellm, litellm          (needs egress)
  #   backend  : llama-1, llama-2, socat-1, socat-2, litellm   (internal)
  #   db       : postgres, litellm                            (internal)
  #   cache    : redis, litellm                               (internal)

  llama-1:
    networks: !override
      - backend

  llama-2:
    networks: !override
      - backend

  # Unused while the overlay is active (nginx.litellm.conf does not proxy to
  # llama-N.sock) but kept running and on `backend` so the base stack's socket
  # contract still holds if the overlay is removed.
  socat-1:
    networks: !override
      - backend

  socat-2:
    networks: !override
      - backend

  webui:
    environment:
      # LiteLLM enforces auth, so this must be a real key. Use a per-client
      # virtual key (created in the Admin UI) rather than the master key, so
      # the UI's traffic is attributable and independently rate-limitable.
      OPENAI_API_KEY: ${LITELLM_WEBUI_KEY:?set LITELLM_WEBUI_KEY in .env (see .env.example)}
    # Off `llama` entirely: the webui reaches the API the same way an external
    # client does, over TLS via host.docker.internal:11437, so it needs no
    # route to the routers or to Postgres. `frontend` keeps normal egress.
    networks: !override
      - frontend

  # nginx does not need this network -- it reads webui.sock from the shared
  # /sockets bind mount -- but socat-webui must reach webui:8080.
  socat-webui:
    networks: !override
      - frontend

  nginx:
    # No healthcheck.sh: llama.cpp is not on a host port when LiteLLM is on,
    # and there is no llama_pool upstream to prune -- LiteLLM does the routing,
    # with one deployment per model (see litellm/config.yaml).
    command:
      - /docker-entrypoint.sh
      - nginx
      - -g
      - daemon off;
    volumes: !override
      - ./nginx/nginx.litellm.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./var/run/sockets:/sockets:ro
    depends_on:
      - socat-litellm
      - socat-webui

networks:
  frontend: {}
  # internal: no gateway, so neither the routers nor the database has a route
  # off the host. Neither needs one: models are local files and Postgres is
  # only ever reached by LiteLLM.
  backend:
    internal: true
  db:
    internal: true
  cache:
    internal: true

volumes:
  postgres-data: {}
  redis-data: {}
